<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-List Recepción de Maquinaria - TRAGSA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#005a36">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CheckList Tragsa">
    <style>
        :root {
            --primary-color: #005a36;
            --border-color: #000;
            --bg-gray: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #525659;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .paper-page {
            background: white;
            width: 100%;
            max-width: 850px;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Header Layout */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .header-table td {
            border: 2px solid var(--border-color);
            padding: 8px;
            vertical-align: middle;
        }

        .logo-cell {
            width: 30%;
            text-align: center;
        }

        .logo-cell img {
            max-height: 45px;
            width: auto;
        }

        .title-cell {
            width: 70%;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        /* Form Grid Details */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
            padding: 10px;
        }

        .field-group {
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
        }

        .field-group label {
            min-width: 130px;
            text-transform: uppercase;
        }

        .field-group input {
            flex-grow: 1;
            border: none;
            border-bottom: 1px solid #000;
            padding: 2px 4px;
            font-size: 12px;
        }

        /* Main Check List Table */
        .checklist-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .checklist-table th, .checklist-table td {
            border: 1px solid var(--border-color);
            padding: 5px;
            font-size: 11px;
        }

        .checklist-table th {
            background-color: var(--bg-gray);
            text-transform: uppercase;
            text-align: center;
        }

        .col-concept { width: 40%; font-weight: bold; }
        .col-status { width: 10%; text-align: center; }
        .col-obs { width: 32%; }
        .col-photo { width: 18%; text-align: center; }

        .checklist-table td input[type="text"] {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 11px;
        }

        .status-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Photo Upload & Preview */
        .photo-btn-label {
            background-color: #005a36;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            display: inline-block;
        }

        .photo-btn-label:hover {
            background-color: #004026;
        }

        .photo-preview {
            max-width: 60px;
            max-height: 45px;
            object-fit: cover;
            display: block;
            margin: 3px auto;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
        }

        /* Signatures Section */
        .signatures-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
            border: 2px solid var(--border-color);
            padding: 10px;
        }

        .sig-box {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
        }

        .sig-canvas {
            border: 1px dashed #666;
            width: 100%;
            height: 90px;
            background-color: #fafafa;
            margin-top: 5px;
            cursor: crosshair;
        }

        /* Gallery Grid for Print/View Photos */
        .photos-appendix {
            margin-top: 20px;
            border: 2px solid var(--border-color);
            padding: 10px;
        }

        .photos-appendix-title {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .photo-card {
            border: 1px solid #ccc;
            padding: 5px;
            text-align: center;
            font-size: 10px;
        }

        .photo-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        /* Action Buttons */
        .action-bar {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-clear {
            background-color: #c9302c;
        }

        /* Modal Viewer */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }

        .modal img { max-width: 90%; max-height: 90%; border-radius: 4px; }

        @media print {
            body { background: white; padding: 0; }
            .paper-page { box-shadow: none; max-width: 100%; padding: 0; margin-bottom: 0; }
            .action-bar, .photo-btn-label { display: none !important; }
            .sig-canvas { border: none; }
            input, textarea { border: none !important; }
            .photo-preview { max-width: 50px; max-height: 35px; }
        }
    </style>
</head>
<body>

    <div class="action-bar">
        <button class="btn btn-clear" onclick="limpiarFormulario()">Limpiar Formulario</button>
        <button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button>
    </div>

    <!-- PÁGINA 1 -->
    <div class="paper-page">
        <table class="header-table">
            <tr>
                <td class="logo-cell">
                    <img src="logo.png" alt="Grupo Tragsa" id="img-logo">
                </td>
                <td class="title-cell">
                    CHECK-LIST RECEPCIÓN DE MAQUINARIA
                </td>
            </tr>
        </table>

        <div class="info-grid">
            <div class="field-group"><label>TIPO DE MÁQUINA:</label><input type="text" id="tipo_maq"></div>
            <div class="field-group"><label>Nº TRAGSA:</label><input type="text" id="num_tragsa"></div>
            <div class="field-group"><label>MARCA/MODELO:</label><input type="text" id="marca_modelo"></div>
            <div class="field-group"><label>MATRÍCULA:</label><input type="text" id="matricula"></div>
            <div class="field-group"><label>Nº BASTIDOR:</label><input type="text" id="num_bastidor"></div>
            <div class="field-group"><label>CUENTAHORAS:</label><input type="text" id="cuentahoras"></div>
            <div class="field-group"><label>PROCEDENCIA:</label><input type="text" id="procedencia"></div>
            <div class="field-group"><label>OBRA DESTINO:</label><input type="text" id="obra_destino"></div>
        </div>

        <table class="checklist-table">
            <thead>
                <tr>
                    <th class="col-concept">CONCEPTO A CHEQUEAR</th>
                    <th class="col-status">CORRECTO</th>
                    <th class="col-status">INCORRECTO</th>
                    <th class="col-obs">OBSERVACIONES</th>
                    <th class="col-photo">FOTOGRAFÍA</th>
                </tr>
            </thead>
            <tbody id="checklist-body">
            </tbody>
        </table>
    </div>

    <!-- PÁGINA 2: OBSERVACIONES, FIRMAS Y ANEXO FOTOGRÁFICO -->
    <div class="paper-page" style="page-break-before: always;">
        <table class="header-table">
            <tr>
                <td class="logo-cell">
                    <img src="logo.png" alt="Grupo Tragsa">
                </td>
                <td class="title-cell">CHECK-LIST RECEPCIÓN DE MAQUINARIA (DORSO)</td>
            </tr>
        </table>

        <div style="border: 2px solid var(--border-color); padding: 10px; min-height: 180px; margin-bottom: 15px;">
            <label style="font-weight: bold; font-size: 12px; display: block; margin-bottom: 8px;">OBSERVACIONES / ESTADO VISUAL GENERAL:</label>
            <textarea id="obs_generales" style="width: 100%; height: 140px; border: none; font-size: 12px; resize: none; font-family: inherit;"></textarea>
        </div>

        <!-- Anexo dinámico con las fotos adjuntas -->
        <div class="photos-appendix">
            <div class="photos-appendix-title">REGISTRO FOTOGRÁFICO DE ÍTEMS REVISADOS:</div>
            <div class="photos-grid" id="photos-gallery">
            </div>
        </div>

        <div class="signatures-grid">
            <div class="sig-box">
                <div>REALIZA EL CHECK-LIST TRAGSA</div>
                <div style="margin: 5px 0;"><input type="text" id="sig_name_1" placeholder="Nombre, apellidos y DNI" style="width:90%; text-align:center; border:none; border-bottom:1px solid #999;"></div>
                <canvas id="canvas-firma-1" class="sig-canvas" width="350" height="90"></canvas>
                <div style="font-size:9px; color:#666; margin-top:2px;">Firma Digital / Táctil</div>
            </div>
            <div class="sig-box">
                <div>CONFORME CON EL CHECK-LIST</div>
                <div style="margin: 5px 0;"><input type="text" id="sig_name_2" placeholder="Nombre, apellidos y DNI" style="width:90%; text-align:center; border:none; border-bottom:1px solid #999;"></div>
                <canvas id="canvas-firma-2" class="sig-canvas" width="350" height="90"></canvas>
                <div style="font-size:9px; color:#666; margin-top:2px;">Firma Digital / Táctil</div>
            </div>
        </div>
    </div>

    <!-- Modal para zoom de imagen -->
    <div id="modal-foto" class="modal" onclick="this.style.display='none'">
        <img id="img-ampliada" src="" alt="Vista Previa">
    </div>

    <script>
        const conceptos = [
            "LUZ ROTATIVA",
            "CINTURÓN DE SEGURIDAD",
            "ESPEJOS RETROVISORES",
            "ALARMA ACÚSTICA DE MARCHA ATRÁS",
            "BOCINA-CLAXON",
            "EMISORA",
            "EXTINTOR",
            "ESTADO INTERIOR DE LA CABINA",
            "ESTADO DE LUNAS Y CRISTALES",
            "GOLPES Y ABOLLADURAS",
            "FUNCIONAMIENTO DE TODOS LOS TESTIGOS DEL CUADRO DE INSTRUMENTOS",
            "FUNCIONAMIENTO DE TODOS LOS CONTROLES DE OPERACIÓN DE LA MÁQUINA DEL PUESTO DE OPERACIÓN",
            "Estado de las cubiertas / orugas: ORUGAS",
            "Estado de las cubiertas / orugas: NEUMÁTICO DELANTERO DERECHO",
            "Estado de las cubiertas / orugas: NEUMÁTICO DELANTERO IZQUIERDO",
            "Estado de las cubiertas / orugas: NEUMÁTICO TRASERO DERECHO",
            "Estado de las cubiertas / orugas: NEUMÁTICO TRASERO IZQUIERDO",
            "FUNCIONAMIENTO DE LAS LUCES E INDICADORES",
            "AIRE ACONDICIONADO",
            "Documentación máquina: MANUAL DEL OPERADOR",
            "Documentación máquina: HOJA DE CONTROL DE ÚLTIMOS MANTENIMIENTOS",
            "INEXISTENCIA DE PÉRDIDAS DE FLUIDOS EN MÁQUINA (Indicar componente)",
            "NIVELES: NIVEL DE ACEITE MOTOR",
            "NIVELES: NIVEL DE REFRIGERANTE",
            "NIVELES: NIVEL DE ACEITE HIDRÁULICO",
            "OTROS: DIENTES Y PROTECCIONES DEL CAZO",
            "OTROS: CAZO"
        ];

        const tbody = document.getElementById("checklist-body");

        conceptos.forEach((concepto, idx) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="col-concept">${concepto}</td>
                <td class="col-status">
                    <input type="checkbox" class="status-checkbox" name="chk_c_${idx}" onclick="toggleCheck(this, 'chk_i_${idx}')">
                </td>
                <td class="col-status">
                    <input type="checkbox" class="status-checkbox" name="chk_i_${idx}" onclick="toggleCheck(this, 'chk_c_${idx}')">
                </td>
                <td class="col-obs">
                    <input type="text" id="obs_${idx}" placeholder="Anotaciones...">
                </td>
                <td class="col-photo">
                    <label class="photo-btn-label" for="file_${idx}">📷 Foto</label>
                    <input type="file" id="file_${idx}" accept="image/*" capture="environment" style="display:none;" onchange="procesarFoto(event, ${idx})">
                    <img id="prev_${idx}" class="photo-preview" style="display:none;" onclick="ampliarFoto(this.src)">
                </td>
            `;
            tbody.appendChild(tr);
        });

        function toggleCheck(current, oppositeName) {
            if (current.checked) {
                document.getElementsByName(oppositeName)[0].checked = false;
            }
            guardarEstadoLocal();
        }

        function procesarFoto(event, idx) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxDim = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        const prevImg = document.getElementById(`prev_${idx}`);
                        prevImg.src = dataUrl;
                        prevImg.style.display = 'block';
                        
                        actualizarGaleria();
                        guardarEstadoLocal();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function actualizarGaleria() {
            const gallery = document.getElementById("photos-gallery");
            gallery.innerHTML = "";
            let fotosEncontradas = 0;

            conceptos.forEach((concepto, idx) => {
                const prev = document.getElementById(`prev_${idx}`);
                if (prev && prev.src && prev.style.display !== "none") {
                    fotosEncontradas++;
                    const card = document.createElement("div");
                    card.className = "photo-card";
                    card.innerHTML = `
                        <img src="${prev.src}" onclick="ampliarFoto(this.src)">
                        <div style="margin-top:3px; font-weight:bold;">${concepto}</div>
                    `;
                    gallery.appendChild(card);
                }
            });

            if (fotosEncontradas === 0) {
                gallery.innerHTML = '<div style="grid-column: span 3; font-size: 10px; color: #777; text-align: center;">Sin imágenes capturadas para los ítems.</div>';
            }
        }

        function ampliarFoto(src) {
            document.getElementById("img-ampliada").src = src;
            document.getElementById("modal-foto").style.display = "flex";
        }

        function initCanvasFirma(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            let dibujando = false;

            function start(e) {
                dibujando = true;
                ctx.beginPath();
                const pos = getPos(e);
                ctx.moveTo(pos.x, pos.y);
            }

            function move(e) {
                if (!dibujando) return;
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }

            function stop() {
                dibujando = false;
                guardarEstadoLocal();
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            canvas.addEventListener("mousedown", start);
            canvas.addEventListener("mousemove", move);
            canvas.addEventListener("mouseup", stop);

            canvas.addEventListener("touchstart", start, {passive: true});
            canvas.addEventListener("touchmove", move, {passive: true});
            canvas.addEventListener("touchend", stop);
        }

        initCanvasFirma("canvas-firma-1");
        initCanvasFirma("canvas-firma-2");

        function guardarEstadoLocal() {
            const data = {};
            document.querySelectorAll("input[type=text], textarea").forEach(el => {
                if (el.id) data[el.id] = el.value;
            });
            document.querySelectorAll("input[type=checkbox]").forEach(el => {
                if (el.name) data[el.name] = el.checked;
            });
            conceptos.forEach((_, idx) => {
                const prev = document.getElementById(`prev_${idx}`);
                if (prev && prev.src && prev.style.display !== 'none') data[`photo_${idx}`] = prev.src;
            });
            localStorage.setItem("tragsa_checklist_draft", JSON.stringify(data));
        }

        function cargarEstadoLocal() {
            const saved = localStorage.getItem("tragsa_checklist_draft");
            if (!saved) {
                actualizarGaleria();
                return;
            }
            const data = JSON.parse(saved);
            Object.keys(data).forEach(key => {
                if (key.startsWith("photo_")) {
                    const idx = key.split("_")[1];
                    const prev = document.getElementById(`prev_${idx}`);
                    if (prev && data[key]) {
                        prev.src = data[key];
                        prev.style.display = "block";
                    }
                } else {
                    const elInput = document.getElementById(key);
                    const elChk = document.getElementsByName(key)[0];
                    if (elInput) elInput.value = data[key];
                    if (elChk) elChk.checked = data[key];
                }
            });
            actualizarGaleria();
        }

        function limpiarFormulario() {
            if (confirm("¿Estás seguro de que deseas borrar todo el formulario y las fotos cargadas?")) {
                localStorage.removeItem("tragsa_checklist_draft");
                window.location.reload();
            }
        }

        document.addEventListener("input", guardarEstadoLocal);
        window.onload = cargarEstadoLocal;
    </script>
</body>
</html>
